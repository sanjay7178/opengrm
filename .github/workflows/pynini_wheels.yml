name: Pynini wheels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  wheel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      USE_BAZEL_VERSION: 9.1.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ hashFiles('.bazelrc', '**/*.bzl') }}
          repository-cache: true
      - name: Build and test Pynini with Bazel
        run: |
          bazelisk build -c opt --build_python_zip \
            //opengrm/pynini:wheel_inputs \
            //opengrm/pynini:pynini_main_cc_shared \
            @com_google_openfst//openfst/extensions/python:pywrapfst_main_cc_shared
          bazelisk test -c opt --test_output=errors //opengrm/pynini:pynini_test
      - name: Build wheel
        run: |
          python -m pip install --upgrade wheel auditwheel patchelf
          python scripts/build_pynini_wheel.py \
            bazel-bin/opengrm/pynini/wheel_inputs.zip \
            wheelhouse --sha "$GITHUB_SHA"
          mkdir -p runfiles dist
          python -m zipfile -e bazel-bin/opengrm/pynini/wheel_inputs.zip runfiles
          test -n "$(find -L bazel-bin -name 'libpywrapfst_main_cc_shared.so' -print -quit)"
          mapfile -d '' native_dirs < <(find -L "$(realpath bazel-bin)" "$(realpath runfiles)" \
            -type f -name '*.so*' -printf '%h\0' | sort -zu)
          IFS=:
          export LD_LIBRARY_PATH="${native_dirs[*]}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          unset IFS
          auditwheel repair wheelhouse/*.whl --wheel-dir dist
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
      - name: Verify installed wheel
        run: |
          python -m venv /tmp/pynini-wheel-check
          /tmp/pynini-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pynini-wheel-check/bin/python -c 'from opengrm.pynini import pynini; from opengrm.pynini.lib import pynutil; assert pynini.accep("ok").string() == "ok"; assert pynutil.insert("ok").string() == "ok"'
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pynini-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 90
      - name: Publish wheels to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="ghcr.io/${GITHUB_REPOSITORY,,}/pynini-wheels:sha-${GITHUB_SHA}"
          mkdir -p package/wheels
          cp dist/*.whl package/wheels/
          cat > package/Dockerfile <<'EOF'
          FROM scratch
          COPY wheels/ /wheels/
          EOF
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$package" package
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$package"
